<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--fg:#e5e7eb;--bg:#1e293b;--bd:#475569;--pop:#0f172a}
html,body{margin:0;padding:0;background:transparent;color:var(--fg);font-family:system-ui,"Segoe UI",Arial,sans-serif}
#bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;min-height:28px;margin-bottom:6px}
.chip{padding:2px 10px;border-radius:999px;color:#111;font-weight:600}
#hali{margin-left:auto;opacity:.75}
#wrap{position:relative;height:300px}
#back,#ta{position:absolute;inset:0;margin:0;padding:12px;box-sizing:border-box;border:1px solid var(--bd);border-radius:10px;
  font:16px/1.7 system-ui,"Segoe UI",Arial,sans-serif;white-space:pre-wrap;word-wrap:break-word;overflow-y:auto;scrollbar-gutter:stable}
#back{background:var(--bg);color:transparent;pointer-events:none;overflow:hidden}
#ta{background:transparent;color:var(--fg);caret-color:var(--fg);resize:none;outline:none}
.e{border-bottom:2px solid;border-radius:2px}
#pop{position:absolute;display:none;z-index:5;background:var(--pop);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;width:290px;box-shadow:0 8px 24px rgba(0,0,0,.45);font-size:14px}
#pop .k{font-size:12px;font-weight:700;margin-bottom:4px}
#pop .s{margin:4px 0}
#pop .x{opacity:.8;font-size:13px;margin:4px 0 8px}
#pop button{cursor:pointer;border:0;border-radius:8px;padding:6px 12px;font-weight:600;margin-right:6px}
#tumia{background:#22c55e;color:#06220f}#puuza{background:#334155;color:#e5e7eb}
</style></head>
<body>
<div id="bar"><span id="idadi">Anza kuandika...</span><span id="vichipu"></span><span id="hali"></span></div>
<div id="wrap"><div id="back"></div><textarea id="ta" spellcheck="false" placeholder="Andika au bandika maandishi ya Kiswahili hapa..."></textarea>
<div id="pop"><div class="k" id="pk"></div><div class="s" id="ps"></div><div class="x" id="px"></div><button id="tumia">Tumia</button><button id="puuza">Puuza</button></div></div>
<script>
//<RULES>
const MAJINA={"tanzania":"Tanzania","kenya":"Kenya","uganda":"Uganda","rwanda":"Rwanda","burundi":"Burundi","zanzibar":"Zanzibar","dodoma":"Dodoma","arusha":"Arusha","mwanza":"Mwanza","afrika":"Afrika","dar es salaam":"Dar es Salaam","kiswahili":"Kiswahili","kiingereza":"Kiingereza","kifaransa":"Kifaransa","kiarabu":"Kiarabu","jumatatu":"Jumatatu","jumanne":"Jumanne","jumatano":"Jumatano","alhamisi":"Alhamisi","ijumaa":"Ijumaa","jumamosi":"Jumamosi","jumapili":"Jumapili","januari":"Januari","februari":"Februari","machi":"Machi","aprili":"Aprili","mei":"Mei","juni":"Juni","julai":"Julai","agosti":"Agosti","septemba":"Septemba","oktoba":"Oktoba","novemba":"Novemba","desemba":"Desemba"};
const TAHAJIA={"kwahiyo":"kwa hiyo","kwasababu":"kwa sababu","kwamfano":"kwa mfano","nakadhalika":"na kadhalika","shukurani":"shukrani","hatimae":"hatimaye"};
const VIAMBATISHO=new Set(["dkt","mhe","bw","bi","prof","mf","nk","km","sh","tsh","mh","ndg","eng","mch"]);
const NENO_FUPI="na|kwa|ya|wa|la|za|cha|vya|katika|ni|kuwa|kwamba|lakini|pia|au|hii|hiyo|huu|huo|hizi|hizo|yake|wake|yangu|wangu";
function esc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}
function tat(start,end,original,suggestion,category,explanation,source){return {start,end,original,suggestion,category,explanation,source};}
function kamaHerufi(o,s){return o.charAt(0)!==o.charAt(0).toLowerCase()?s.charAt(0).toUpperCase()+s.slice(1):s;}
function kanuni(text){
  const t=[];let m,re;
  for(const [low,sah] of Object.entries(MAJINA)){
    re=new RegExp("(?<![A-Za-z'])"+esc(low)+"(?![A-Za-z'])","g");
    while((m=re.exec(text)))t.push(tat(m.index,m.index+m[0].length,m[0],sah,"tahajia","Majina ya siku, miezi, nchi na lugha huanza kwa herufi kubwa.","kanuni"));
  }
  for(const [kosa,sah] of Object.entries(TAHAJIA)){
    re=new RegExp("(?<![A-Za-z'])"+kosa+"(?![A-Za-z'])","gi");
    while((m=re.exec(text)))t.push(tat(m.index,m.index+m[0].length,m[0],kamaHerufi(m[0],sah),"tahajia","Tahajia sanifu ni '"+sah+"'.","kanuni"));
  }
  re=new RegExp("(?<![A-Za-z'])("+NENO_FUPI+")[ \\t]+\\1(?![A-Za-z'])","gi");
  while((m=re.exec(text)))t.push(tat(m.index,m.index+m[0].length,m[0],m[1],"sarufi","Neno limerudiwa bila sababu.","kanuni"));
  re=/(?<=\S)( {2,})(?=\S)/g;
  while((m=re.exec(text)))t.push(tat(m.index,m.index+m[0].length,m[0]," ","uakifishaji","Nafasi ni nyingi kupita kiasi.","kanuni"));
  re=/(\S)([ \t]+)([,;:!?]|\.(?!\.))/g;
  while((m=re.exec(text)))t.push(tat(m.index,m.index+m[0].length,m[0],m[1]+m[3],"uakifishaji","Hakuna nafasi kabla ya alama ya uakifishaji.","kanuni"));
  re=/([A-Za-z])([,;!?])([A-Za-z])/g;
  while((m=re.exec(text)))t.push(tat(m.index,m.index+m[0].length,m[0],m[1]+m[2]+" "+m[3],"uakifishaji","Weka nafasi baada ya alama ya uakifishaji.","kanuni"));
  re=/([a-z]{2,})(\.)([A-Z][a-z])/g;
  while((m=re.exec(text))){
    if(VIAMBATISHO.has(m[1].toLowerCase())||text.slice(Math.max(0,m.index-4),m.index).toLowerCase().includes("www"))continue;
    t.push(tat(m.index,m.index+m[0].length,m[0],m[1]+". "+m[3],"uakifishaji","Weka nafasi baada ya nukta.","kanuni"));
  }
  m=/^[\s"'(\[]*([a-z])/.exec(text);
  if(m){const i=m[0].length-1;t.push(tat(i,i+1,text.charAt(i),text.charAt(i).toUpperCase(),"tahajia","Sentensi huanza kwa herufi kubwa.","kanuni"));}
  re=/([.!?]["')\]]*\s+)([a-z])/g;
  while((m=re.exec(text))){
    const upto=text.slice(0,m.index+m[1].length);
    const k=/([A-Za-z]+)[.!?]["')\]]*\s+$/.exec(upto);
    if(k&&VIAMBATISHO.has(k[1].toLowerCase()))continue;
    const i=m.index+m[1].length;
    t.push(tat(i,i+1,text.charAt(i),text.charAt(i).toUpperCase(),"tahajia","Sentensi huanza kwa herufi kubwa.","kanuni"));
  }
  return t;
}
function unganisha(list){
  list=list.slice().sort((a,b)=>a.start-b.start||(b.end-b.start)-(a.end-a.start)||((a.source!=="kanuni")-(b.source!=="kanuni")));
  const out=[];let last=-1;
  for(const x of list){if(x.start>=last){out.push(x);last=x.end;}}
  out.forEach((x,i)=>x.id=i);return out;
}
//</RULES>
const RANGI={tahajia:["Tahajia","#ef4444"],sarufi:["Sarufi","#3b82f6"],uakifishaji:["Uakifishaji","#f59e0b"],mtindo:["Mtindo","#a855f7"]};
const $=id=>document.getElementById(id);
const ta=$("ta"),back=$("back"),pop=$("pop");
let aiIssues=[],aiText="",aiError="",ignored=new Set(),current=[],lastSent="",timer=null,popId=null;

function Streamlit_send(type,data){window.parent.postMessage(Object.assign({isStreamlitMessage:true,type:type},data),"*");}
function relocate(issues,t){
  const out=[];
  for(const x of issues){
    let best=-1,bd=1e9,from=0;
    for(;;){const i=t.indexOf(x.original,from);if(i<0)break;const d=Math.abs(i-x.start);if(d<bd){bd=d;best=i;}from=i+1;}
    if(best>=0&&bd<=400)out.push(Object.assign({},x,{start:best,end:best+x.original.length,source:"ai"}));
  }
  return out;
}
function recompute(){
  const t=ta.value;
  const ok=x=>!ignored.has(x.original+"|"+x.suggestion);
  current=unganisha(kanuni(t).filter(ok).concat(relocate(aiIssues,t).filter(ok)));
  render();
}
function render(){
  const t=ta.value;back.textContent="";let p=0;
  current.forEach(x=>{
    back.appendChild(document.createTextNode(t.slice(p,x.start)));
    const s=document.createElement("span");s.className="e";s.dataset.i=x.id;
    const c=(RANGI[x.category]||["",""])[1]||"#9ca3af";s.style.borderBottomColor=c;s.style.background=c+"33";
    s.textContent=t.slice(x.start,x.end)||"\u00a0";back.appendChild(s);p=x.end;
  });
  back.appendChild(document.createTextNode(t.slice(p)+"\n"));
  back.scrollTop=ta.scrollTop;
  const n={};current.forEach(x=>n[x.category]=(n[x.category]||0)+1);
  $("idadi").textContent=t.trim()?(current.length?current.length+" makosa":"Hakuna makosa"):"Anza kuandika...";
  const vc=$("vichipu");vc.textContent="";
  Object.keys(RANGI).forEach(k=>{if(n[k]){const s=document.createElement("span");s.className="chip";s.style.background=RANGI[k][1];s.textContent=RANGI[k][0]+" "+n[k];vc.appendChild(s);}});
  const sw=t.trim().length>=8;
  $("hali").textContent=aiError?aiError:(sw&&aiText!==t&&lastSent===t?"AI inakagua...":(aiText===t&&sw?"AI imekagua":""));
}
function showPop(id){
  const x=current.find(i=>i.id===id);if(!x){pop.style.display="none";return;}
  popId=id;const k=RANGI[x.category]||["Mengineyo","#9ca3af"];
  $("pk").textContent=k[0];$("pk").style.color=k[1];
  $("ps").textContent="\u201c"+x.original+"\u201d \u2192 \u201c"+x.suggestion+"\u201d";
  $("px").textContent=x.explanation||"";
  const sp=back.querySelector('[data-i="'+id+'"]');
  if(sp){const r=sp.getBoundingClientRect(),w=$("wrap").getBoundingClientRect();
    pop.style.left=Math.max(0,Math.min(w.width-300,r.left-w.left))+"px";
    pop.style.top=Math.min(w.height-150,r.bottom-w.top+6)+"px";}
  pop.style.display="block";
}
function hit(){const i=ta.selectionStart;const x=current.find(e=>i>=e.start&&i<=e.end&&ta.selectionStart===ta.selectionEnd);x?showPop(x.id):pop.style.display="none";}
pop.addEventListener("mousedown",e=>e.preventDefault());
$("tumia").onclick=()=>{
  const x=current.find(i=>i.id===popId);if(!x)return;
  const t=ta.value;ta.value=t.slice(0,x.start)+x.suggestion+t.slice(x.end);
  const c=x.start+x.suggestion.length;ta.setSelectionRange(c,c);pop.style.display="none";onInput();
};
$("puuza").onclick=()=>{const x=current.find(i=>i.id===popId);if(x)ignored.add(x.original+"|"+x.suggestion);pop.style.display="none";recompute();};
function onInput(){
  recompute();pop.style.display="none";clearTimeout(timer);
  timer=setTimeout(()=>{const t=ta.value;if(t.trim().length>=8&&t!==lastSent){lastSent=t;aiError="";Streamlit_send("streamlit:setComponentValue",{value:{text:t,ts:Date.now()},dataType:"json"});render();}},900);
}
ta.addEventListener("input",onInput);
ta.addEventListener("scroll",()=>{back.scrollTop=ta.scrollTop;});
ta.addEventListener("click",hit);ta.addEventListener("keyup",e=>{if(!["Shift","Control","Alt","Meta"].includes(e.key))hit();});
window.addEventListener("message",e=>{
  const d=e.data||{};if(d.type!=="streamlit:render")return;
  const a=d.args||{};aiIssues=a.ai_issues||[];aiText=a.ai_text||"";aiError=a.ai_error||"";
  if(a.initial_text&&!ta.value&&!ta.dataset.init){ta.value=a.initial_text;ta.dataset.init="1";}
  const th=d.theme||{};
  if(th.textColor)document.documentElement.style.setProperty("--fg",th.textColor);
  if(th.secondaryBackgroundColor){document.documentElement.style.setProperty("--bg",th.secondaryBackgroundColor);document.documentElement.style.setProperty("--pop",th.backgroundColor||"#0f172a");}
  recompute();Streamlit_send("streamlit:setFrameHeight",{height:400});
});
Streamlit_send("streamlit:componentReady",{apiVersion:1});
recompute();Streamlit_send("streamlit:setFrameHeight",{height:400});
</script></body></html>
